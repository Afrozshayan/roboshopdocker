services:
  catalogue:
    build: ./catalogue
    dockerfile: Dockerfile
    image: bashaafroz/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  mongodb:
    build: ./mongodb
    dockerfile: Dockerfile
    image: mongodb:v1
    container_name: bashaafroz/mongodb:v1
    volumes:
    - mongodb:/data/db
  redis:
    image: /redis:7.0
    container_name: redis
    volumes:
    - redis:/data
  mysql:
    build: ./mysql
    dockerfile: Dockerfile
    image: bashaafroz/mysql:v1
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql 
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
    - rabbitmq:/var/lib/rabbitmq
  user:
    build: ./user
    dockerfile: Dockerfile
    image: /bashaafroz/user:v1
    container_name: user
    depends_on:
    - mongodb
    - redis
  cart:
    build: ./cart
    dockerfile: Dockerfile
    image: bashaafroz/cart:v1
    container_name: cart
    depends_on:
    - redis
    - catalogue
  shipping:
    build: ./shipping
    dockerfile: Dockerfile
    image: bashaafroz/shipping:v1
    container_name: shipping
    depends_on:
    - mysql
    - cart
  payment:
    build: ./payment
    dockerfile: Dockerfile
    image: bashaafroz/payment:v1
    container_name: payment
    depends_on:
    - rabbitmq
    - user
    - cart
  frontend:
    build: ./frontend
    dockerfile: Dockerfile
    image: frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment
networks: 
  default: 
    driver: bridge
    name: roboshop
    external: false
volumes:
  mongodb:
  redis:
  rabbitmq:
  mysql: 
